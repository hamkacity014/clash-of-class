services:
  app:
    container_name: clash-of-class-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    restart: unless-stopped
